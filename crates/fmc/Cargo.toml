[package]
name = "fmc"
version = "0.0.5"
license = "MIT OR Apache-2.0"
description = "Library for creating fmc servers"
repository.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
zstd.workspace = true
bincode.workspace = true
crossbeam.workspace = true
rusqlite.workspace = true

fmc_noise.workspace = true
fmc_protocol.workspace = true

bevy_app = { version = "0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std", "multi_threaded", "async_executor", "serialize", "debug"] }
bevy_math = { version = "0.19.1", default-features = false, features = ["std", "serialize"] }
bevy_tasks = { version = "0.19.1", default-features = false, features = ["multi_threaded"] }
bevy_time = { version = "0.19.1", default-features = false, features = ["std", "serialize"] }
bevy_utils = { version = "0.19.1", default-features = false, features = ["std", "parallel", "buffered_channel"] }
bevy_derive = "0.19.1"
bevy_log = "0.19.1"
bevy_platform = { version = "0.19.1", default-features = false, features = ["std"] }

gltf = "1.4.1"
once_cell = "1.21.4"

[lints]
workspace = true
