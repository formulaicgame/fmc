[package]
name = "fmc_client"
version = "0.1.0"
license-file = "LICENSE"
edition.workspace = true

[[bin]]
name = "fmc"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["default", "serialize", "file_watcher"] }
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
zstd.workspace = true
tar.workspace = true
crossbeam.workspace = true
rusqlite.workspace = true

fmc_protocol.workspace = true
fmc_noise.workspace = true

clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
wasmtime = "=50.0.1"
ureq = "3.3.0"
nonmax = "0.5.5"
bitflags = "2.13.0"

[target.'cfg(windows)'.dependencies]
junction = "2.0.0"

[build-dependencies]
tar.workspace = true
zstd.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["docs/examples"]

[workspace.package]
edition = "2024"
repository = "https://github.com/formulaicgame/fmc"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false }
serde ={ version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tar = "0.4.46"
zstd = "0.13.3"
bincode = "1.3.3"
crossbeam = { version = "0.5.15", package = "crossbeam-channel" }
rusqlite = { version = "0.40.1", features = ["bundled"] }

fmc_noise = "0.3.2"

fmc_protocol = { path = "crates/fmc_protocol", version = "0.1.3" }
fmc_protocol_derive = { path = "crates/fmc_protocol_derive", version = "0.1.0" }

[profile.dev]
strip = "debuginfo" # Prevent disk churn
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
# https://github.com/bevyengine/bevy/issues/14291
debug-assertions = false

[profile.release]
strip = true
# Decreases linux binary size by 33% but increases compile time by a lot
#lto = true

# flamegraph
# [profile.release]
# debug=true
